<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finnanzi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Portada -->
<section id="section-home" class="section active">
    <div class="home-container">
        <h1>Finnanzi</h1>
        <div class="home-icon">💰🪙</div>
        <p>Controla tus gastos y metas de ahorro fácilmente</p>
        <div class="home-buttons">
            <button class="btn" data-section="section-transactions">Transacciones</button>
            <button class="btn" data-section="section-goals">Metas</button>
            <button class="btn" data-section="section-reports">Reportes</button>
        </div>
    </div>
</section>

<!-- Sección de Transacciones -->
<section id="section-transactions" class="section">
    <h2>Transacciones</h2>
    <form id="transaction-form">
        <div class="form-group">
            <label for="transaction-type">Tipo</label>
            <select id="transaction-type">
                <option value="income">Ingreso</option>
                <option value="expense">Gasto</option>
            </select>
        </div>
        <div class="form-group">
            <label for="transaction-amount">Monto (Bs.)</label>
            <input type="number" id="transaction-amount" placeholder="Ej: 500">
        </div>
        <div class="form-group">
            <label for="transaction-category">Categoría</label>
            <select id="transaction-category"></select>
        </div>
        <div class="form-group">
            <label for="transaction-description">Descripción</label>
            <input type="text" id="transaction-description" placeholder="Ej: Compra supermercado">
        </div>
        <div class="form-group">
            <label for="transaction-date">Fecha</label>
            <input type="date" id="transaction-date">
        </div>
        <button type="submit" class="btn-success">Agregar Transacción</button>
    </form>

    <h3>Historial de Transacciones</h3>
    <div id="transaction-history"></div>
</section>

<!-- Sección de Metas -->
<section id="section-goals" class="section">
    <h2>Metas de Ahorro</h2>
    <form id="goal-form">
        <div class="form-group">
            <label for="goal-name">Nombre de la Meta</label>
            <input type="text" id="goal-name" placeholder="Ej: Vacaciones">
        </div>
        <div class="form-group">
            <label for="goal-target">Monto Objetivo (Bs.)</label>
            <input type="number" id="goal-target" placeholder="Ej: 5000">
        </div>
        <div class="form-group">
            <label for="goal-deadline">Fecha Límite</label>
            <input type="date" id="goal-deadline">
        </div>
        <div class="form-group">
            <label for="goal-description">Descripción</label>
            <textarea id="goal-description" placeholder="Detalles de la meta"></textarea>
        </div>
        <button type="submit" class="btn-success">Agregar Meta</button>
    </form>

    <h3>Metas Activas</h3>
    <div id="goal-list"></div>
</section>

<!-- Sección de Reportes -->
<section id="section-reports" class="section">
    <h2>Reportes</h2>
    <div class="report-summary">
        <p>Total Ingresos: <span id="total-income">Bs. 0.00</span></p>
        <p>Total Gastos: <span id="total-expense">Bs. 0.00</span></p>
        <p>Balance Total: <span id="total-balance">Bs. 0.00</span></p>
    </div>
    <button id="generate-report" class="btn">Actualizar Reporte</button>
</section>

<script src="script.js"></script>
<script>
    // Navegación entre secciones
    document.querySelectorAll('.btn[data-section]').forEach(btn => {
        btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-section');
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(target).classList.add('active');
        });
    });

    // Configurar fecha actual
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('transaction-date').value = today;
    document.getElementById('goal-deadline').valueAsDate = new Date(Date.now() + 30*24*60*60*1000);
</script>
</body>
</html>
